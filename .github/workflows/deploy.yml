name: Deploy to Namecheap

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: server359.web-hosting.com
          username: deploy@7jenglish.com
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          state-name: .ftp-deploy-sync-state-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/config.php
            **/vendor/**
            **/uploads/cache/**
            **/uploads/auto_log/**
            **/vendor.zip
            **/*.log
            **/error_log
            **/.DS_Store
            **/Thumbs.db
